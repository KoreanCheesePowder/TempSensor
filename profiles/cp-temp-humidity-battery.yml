name: cp-temp-humidity-battery
components:
  - id: main
    capabilities:
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: battery
        version: 1
      - id: firmwareUpdate
        version: 1
      - id: refresh
        version: 1
      - id: buildbook37604.driverInformation
        version: 1
    categories:
      - name: TempHumiditySensor
deviceConfig:
  dashboard:
    states:
      - component: main
        capability: temperatureMeasurement
        version: 1
        group: main
        values:
          - label: "{{temperature.value}} {{temperature.unit}}"
        composite: true
      - component: main
        capability: relativeHumidityMeasurement
        version: 1
        group: main
        values:
          - label: " {{humidity.value}} {{humidity.unit}}"
        composite: true
    actions: []
    basicPlus: []
  detailView:
    - component: main
      capability: temperatureMeasurement
      version: 1
    - component: main
      capability: relativeHumidityMeasurement
      version: 1
    - component: main
      capability: battery
      version: 1
    - component: main
      capability: firmwareUpdate
      version: 1
    - component: main
      capability: refresh
      version: 1
    - component: main
      capability: buildbook37604.driverInformation
      version: 1
  automation:
    conditions:
      - component: main
        capability: temperatureMeasurement
        version: 1
      - component: main
        capability: relativeHumidityMeasurement
        version: 1
      - component: main
        capability: battery
        version: 1
    actions:
      - component: main
        capability: refresh
        version: 1

preferences:
  - preferenceId: tempOffset
    explicit: true
  - name: temperaturePrecision
    title: 온도 표시 정밀도
    description: 표시 및 자동화에 사용하는 온도 값을 선택한 단위로 반올림합니다.
    required: true
    preferenceType: enumeration
    definition:
      options:
        p01: "0.1 C"
        p05: "0.5 C"
        p10: "1.0 C"
      default: p01
  - name: temperatureReportDelta
    title: 온도 변화 보고 기준
    description: 이 값 이상 온도가 변하면 센서가 새 값을 보고합니다.
    required: true
    preferenceType: enumeration
    definition:
      options:
        "10": "0.1 C"
        "20": "0.2 C"
        "30": "0.3 C"
        "50": "0.5 C"
        "100": "1.0 C"
      default: "10"
  - name: temperatureReportMin
    title: 온도 최소 보고 간격
    description: 온도 보고 사이에 허용되는 최소 간격입니다.
    required: true
    preferenceType: enumeration
    definition:
      options:
        "1": "1초"
        "2": "2초"
        "5": "5초"
        "10": "10초"
      default: "1"
  - name: sensorReportInterval
    title: 센서 정기 보고 주기
    description: 센서 펌웨어가 지원하는 범위에서 이 주기마다 깨어나 온도와 습도를 다시 보고합니다. 주기를 짧게 설정할수록 배터리 소모가 증가합니다.
    required: true
    preferenceType: enumeration
    definition:
      options:
        "10": "10초"
        "30": "30초"
        "60": "1분"
        "300": "5분"
        "600": "10분"
        "900": "15분"
        "1800": "30분"
        "3600": "60분"
      default: "60"

  - name: sleepCheckInInterval
    title: 센서 절전 체크인 주기
    description: 센서가 절전 상태에서 허브의 대기 명령을 확인하는 주기입니다. 짧게 설정할수록 응답은 빨라지지만 배터리 소모가 크게 증가합니다.
    required: true
    preferenceType: enumeration
    definition:
      options:
        "1": "1초"
        "5": "5초"
        "10": "10초"
        "30": "30초"
        "60": "1분"
        "300": "5분"
        "600": "10분"
        "1740": "29분 (기본값)"
        "1800": "30분"
      default: "1740"
  - name: shortPollInterval
    title: 빠른 폴링 간격
    description: 센서가 빠른 폴링 상태일 때 허브를 확인하는 간격입니다. 짧을수록 응답은 빨라지지만 배터리 소모가 증가합니다.
    required: true
    preferenceType: enumeration
    definition:
      options:
        "1": "0.25초"
        "2": "0.5초"
        "4": "1초"
        "8": "2초"
      default: "4"
  - name: fastPollTimeout
    title: 빠른 폴링 유지 시간
    description: 빠른 폴링 상태를 유지하는 시간입니다. 시간이 길수록 배터리 소모가 증가합니다.
    required: true
    preferenceType: enumeration
    definition:
      options:
        "20": "5초"
        "40": "10초"
        "80": "20초"
        "120": "30초"
        "240": "60초"
      default: "40"

  - preferenceId: humidityOffset
    explicit: true
  - name: humidityPrecision
    title: 습도 표시 정밀도
    description: 표시 및 자동화에 사용하는 습도 값을 선택한 단위로 반올림합니다.
    required: true
    preferenceType: enumeration
    definition:
      options:
        "1": "1 %"
        "2": "2 %"
        "5": "5 %"
      default: "1"
  - name: humidityReportDelta
    title: 습도 변화 보고 기준
    description: 이 값 이상 습도가 변하면 센서가 새 값을 보고합니다.
    required: true
    preferenceType: enumeration
    definition:
      options:
        "50": "0.5 %"
        "100": "1 %"
        "200": "2 %"
        "300": "3 %"
        "500": "5 %"
      default: "50"
  - name: humidityReportMin
    title: 습도 최소 보고 간격
    description: 습도 보고 사이에 허용되는 최소 간격입니다.
    required: true
    preferenceType: enumeration
    definition:
      options:
        "1": "1초"
        "2": "2초"
        "5": "5초"
        "10": "10초"
      default: "1"

  - name: saveHistory
    title: 기기 기록에 저장
    description: 온도와 습도 변화를 SmartThings 기기 기록에 저장합니다.
    required: true
    preferenceType: boolean
    definition:
      default: true
metadata:
  mnmn: SmartThingsCommunity
  ocfDeviceType: x.com.st.d.sensor.temphumidity
